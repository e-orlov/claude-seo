  label: Observed Brand Prompt Count
  definition: Число обнаруженных промптов, в ответах на которые бренд упомянут
  coverage_statement: Полное для метрики SISTRIX
  primary_sources:
  - SX-O
  analysis_method_id: geo_factor_b02_v1
  method_family: comparative_gap
  measurement_universe: SISTRIX brand-mention prompt_count in the frozen model/country scope
  applicability_rule:
    metric: source_preflight_pass
    operator: eq
    value: true
  canonical_metrics:
  - name: observed_count
    type: integer
    unit: records
    required: true
    description: Platform-defined observed count in the frozen model/country scope.
  - name: comparable_baseline_available
    type: boolean
    unit: boolean
    required: true
    description: True only when a prior value uses the identical frozen scope.
  - name: change_rate
    type: number
    unit: ratio
    required: false
    description: Change versus the comparable baseline; required when comparable_baseline_available is true.
  measurement_definition:
    source_observation: Число обнаруженных промптов, в ответах на которые бренд упомянут
    unit_of_analysis: SISTRIX brand-mention prompt_count in the frozen model/country scope
    affected_definition: Use the platform-defined observed count; compare over time only when the frozen scope is identical
      and never divide by an invented relevant-prompt denominator.
    aggregation: Use exact current and baseline values in an identical scope; change_rate = (current - baseline) / baseline
      when baseline is nonzero.
    denominator_policy: Use only the platform/source-defined scope; never invent a universal relevant-demand denominator.
  coverage_gate:
    minimum_rate: 0.8
    allowed_scope_types:
    - source_corpus
    - snapshot
