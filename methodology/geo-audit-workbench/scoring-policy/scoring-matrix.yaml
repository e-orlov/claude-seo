  policy_version: 1.0.0
  rule_type: prevalence
  applicability_rule:
    all:
    - metric: source_preflight_pass
      operator: eq
      value: true
    - metric: applicable_universe_count
      operator: gt
      value: 0
  canonical_metrics:
  - name: affected_count
    type: integer
    unit: units
    required: true
    description: Distinct applicable units meeting the factor's failure predicate.
  - name: analyzed_count
    type: integer
    unit: units
    required: true
    description: Distinct applicable units successfully analysed.
  - name: issue_rate
    type: number
    unit: ratio_0_1
    required: true
    description: affected_count divided by analyzed_count.
  - name: critical_affected_count
    type: integer
    unit: units
    required: true
    description: Affected units in confirmed critical clusters.
  - name: critical_issue_rate
    type: number
    unit: ratio_0_1
    required: true
    description: Issue rate within confirmed critical clusters.
  measurement_definition:
    source_observation: Полнота trail, порядок, URLs и соответствие видимой навигации
    unit_of_analysis: indexable URLs with visible or marked-up breadcrumb trails
    affected_definition: The factor analyzer marks each distinct applicable unit affected when at least one material check
      in the source observation fails after documented intentional exclusions.
    aggregation: Use distinct units; issue_rate = affected_count / analyzed_count and calculate critical-cluster values separately.
    denominator_policy: Distinct applicable units in 'indexable URLs with visible or marked-up breadcrumb trails'; missing
      records lower coverage and never enter the denominator as passing units.
  rubric_dimensions: []
  measurement_universe: indexable URLs with visible or marked-up breadcrumb trails
  source_requirements:
  - SF
  - RAW
  - REN
  coverage_gate:
    minimum_rate: 0.9
    allowed_scope_types:
    - full
    - representative_sample
    - snapshot
    - source_corpus
    below_minimum_status: ND
    confirmed_issue_override: false
  evidence_grade: G2_CALCULATED
  confidence_rule:
    base: high
    freshness_class: crawl_14d
    caps:
    - when:
        any:
        - metric: coverage_rate
          operator: lt
          value: 0.9
        - metric: scope_type
          operator: eq
          value: representative_sample
      maximum: medium
      reason: Incomplete full-scope coverage or a representative sample limits sitewide certainty.
    - when:
        any:
        - metric: scope_type
          operator: eq
          value: diagnostic_sample
        - metric: join_quality
          operator: in
          value:
          - fuzzy
          - unresolved
        - metric: artifact_age_days
          operator: gt
          value: 45
      maximum: low
      reason: Diagnostic scope, non-exact joins, or stale crawl evidence permits issue confirmation but weak prevalence inference.
  status_bands:
    evaluation_order:
    - red
    - yellow
    - green
    red:
      any:
      - metric: issue_rate
        operator: gt
        value: 0.1
      - metric: critical_issue_rate
        operator: gt
        value: 0.02
    yellow:
      any:
      - metric: issue_rate
        operator: gt
        value: 0.02
      - metric: critical_affected_count
        operator: gt
        value: 0
    green:
      all:
      - metric: issue_rate
        operator: lte
        value: 0.02
      - metric: critical_affected_count
        operator: eq
        value: 0
  no_data_rule:
    source_level_failure: BLOCK_RUN
    missing_required_metric: ND
    zero_denominator: NA
    not_applicable: NA
  dependency_role: supporting_driver
  dependency_parents: []
  root_cause_group: breadcrumb-entity
  base_priority: P2
  priority_ceiling: P1
  criticality_modifiers:
    profile: url_cluster
    maximum_uplift_steps: 1
    requires_confirmed_mapping: true
  veto_role: none
  recommendation_trigger:
    statuses:
    - red
    - yellow
    minimum_confidence: low
    informational_only: false
  threshold_basis:
    mechanism: official_guidance
    cutoffs: internal_audit_policy
  causal_chain:
    observation: Measure Полнота trail, порядок, URLs и соответствие видимой навигации in the canonical source set.
    mechanism: The issue reduces reliable discovery, interpretation, or user access on a measurable share of applicable URLs.
    affected_scope: indexable URLs with visible or marked-up breadcrumb trails
    consequence: Machine-readable entity information is incomplete, inconsistent, or misleading on the affected pages.
    action: Fix the shared root cause, prioritising confirmed critical clusters, then recrawl the same universe.
    consequence_basis: official
  rationale: BreadcrumbList evaluates Полнота trail, порядок, URLs и соответствие видимой навигации. The mechanism is supported
    as official_guidance; the traffic-light cutoffs are classified as internal_audit_policy and are an audit decision unless
    explicitly official. The result is bounded to the declared universe and does not assert universal ranking causality.
