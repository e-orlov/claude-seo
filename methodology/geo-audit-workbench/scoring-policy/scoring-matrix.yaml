rules:
- factor_id: B01
  factor_name: Целостность scope SISTRIX
  policy_version: 1.0.0
  rule_type: consistency
  applicability_rule:
    metric: source_preflight_pass
    operator: eq
    value: true
  canonical_metrics:
  - name: scope_mismatch_count
    type: integer
    unit: mismatches
    required: true
    description: Material conflicts between approved and observed scope.
  - name: scope_warning_count
    type: integer
    unit: warnings
    required: true
    description: Non-material omissions or ambiguous scope fields.
  measurement_definition:
    source_observation: Домен/бренд, выбранные модели, страны и фильтры, к которым относятся результаты
    unit_of_analysis: all SISTRIX API artifacts and sentiment snapshots for the run
    affected_definition: 'Calculate the canonical profile metrics directly from this source observation: Домен/бренд, выбранные
      модели, страны и фильтры, к которым относятся результаты'
    aggregation: Use the canonical metrics and declared grain exactly; no fuzzy join or undocumented denominator is allowed.
