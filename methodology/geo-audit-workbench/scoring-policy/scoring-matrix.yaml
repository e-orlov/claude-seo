policy_version: 1.0.0
policy_status: frozen
effective_date: '2026-09-15'
factor_count: 129
source_count: 18
policy_fingerprint:
  algorithm: sha256
  canonicalization: canonical-json-v1-excluding-digest
  digest: 77da1451409845f6ba53d97f90071c92a4b26cc248f8d6b2bbc5634aaebe89ed
rubric_value_policy:
  full:
    value: 1.0
    definition: Criterion is completely satisfied and supported by inspectable evidence.
  partial:
    value: 0.5
    definition: Criterion is only partly satisfied; the missing component is named and evidenced.
  fail:
    value: 0.0
    definition: Criterion is absent, contradicted, materially wrong, or unsupported.
  not_applicable:
    value: null
    definition: Criterion is inapplicable under the factor's documented universe and is excluded from the denominator.
evidence_policy:
  grades:
    G1_DIRECT: A value copied from a canonical source field with artifact hash, scope, and exact grain.
    G2_CALCULATED: A deterministic calculation over G1 fields with reproducible SQL/filter and exact denominator.
    G3_SOURCE_LIMITED: A complete observation inside a platform-defined corpus or snapshot that is not a universal demand
      denominator.
    G4_SUPPORTED_INFERENCE: A rule- or rubric-based inference anchored in inspectable excerpts/fields and carrying an explicit
      limitation.
  independence_rule: Repeated fields, pages, or snapshots from the same dependent source do not raise evidence grade or confidence.
  finding_gate:
  - Every finding resolves to at least one evidence ID and source artifact SHA-256.
  - Numerator cannot exceed denominator and representative examples must belong to the calculated affected set.
  - Grain, scope, source limitation, and join quality must agree with the wording of the finding.
  confidence_order:
  - high
  - medium
  - low
  confidence_resolution: Start with the factor confidence base and apply every applicable cap; the lowest resulting confidence
    wins.
  confidence_control_metrics:
    coverage_rate: Analysed required units divided by the declared applicable denominator.
    scope_type: One of full, representative_sample, diagnostic_sample, source_corpus, or snapshot.
    join_quality: One of exact, normalized_exact, fuzzy, or unresolved.
    artifact_age_days: Whole UTC days from source snapshot/crawl time to audit evaluation time.
    material_record_count: Records in the declared source corpus that enter the factor calculation.
    scope_mismatch_count: Detected model, country, domain, language, or date-scope mismatches.
    exact_normalized_field_rate: Comparable claims having exact normalized fields on both sides divided by comparable claims.
    claim_scope_match: True only when entity, product, geography, time and qualifier scope agree.
    missing_rubric_evidence_count: Required rubric dimensions lacking an inspectable locator.
    valid_daily_point_count: Distinct valid daily observations inside one unchanged historical scope.
    missing_day_rate: Missing expected days divided by expected days in the history window.
    scope_break_count: Changes to brand/domain/model/country/method inside the comparison window.
    partial_record_rate: Present but incomplete required records divided by expected records.
    validation_error_count: Failed deterministic integrity assertions for the factor metric.
  conflict_resolution:
    unresolved_input_conflict: When canonical inputs conflict and no documented authoritative precedence resolves them, the
      affected factor is ND and confidence is capped low.
    measured_conflict_exception: When the contradiction itself is the factor's measured outcome, retain the observed issue
      and score that factor; do not replace it with ND.
    required_evidence: Persist every conflicting value, source artifact ID, comparison key, and the applied precedence rule
      or explicit unresolved result.
  freshness_thresholds_days:
    crawl_14d:
      high_max: 14
      medium_max: 45
      older: low
    visibility_30d:
      high_max: 30
      medium_max: 90
      older: low
    static_reference:
      high_max: null
      medium_max: null
      older: unchanged
  join_caps:
    exact: unchanged
    normalized_exact: medium
    fuzzy: low
    unresolved: ND
  source_corpus_size_caps:
    '0': ND
    1_to_9: low
    10_to_29: medium
    30_plus: unchanged
coverage_policy:
  source_level_gate: All 18 canonical sources must pass authentication, scope and schema preflight; otherwise the run is BLOCKED
    before scoring.
  record_level_rule: Missing records inside a present source lower factor coverage; they never become zero-valued observations.
  valid_empty_source_rule: A zero-row artifact is source-ready only when authentication/file access, expected schema, approved
    scope, snapshot date, and successful extraction are all proven. Factor handling then follows its explicit zero_denominator
    rule.
  factor_resolution_order:
  - NA
  - BLOCK_RUN
  - preliminary_status
  - coverage_gate
  - confidence
  confirmed_issue_override: Below minimum coverage, only a preliminary red with confirmed_issue_override=true remains red;
    confidence is capped low. Every other preliminary result becomes ND.
  scope_types:
    full: Every unit in the declared universe was analysed.
    representative_sample: A documented deterministic or stratified sample supports only the sampled/represented universe.
    diagnostic_sample: A non-representative sample supports examples and issue existence, not sitewide prevalence.
    source_corpus: Every returned record in the platform-defined corpus was analysed; no universal demand inference is allowed.
    snapshot: Every displayed record in a dated captured interface snapshot was analysed.
  betroffenheit_bands:
    none: affected_count == 0
    isolated: affected_count > 0 AND affected_rate < 0.01 AND affected_count < 5
    limited: not broad/material AND (affected_rate >= 0.01 OR affected_count >= 5)
    material: not broad AND (affected_rate >= 0.05 OR affected_count >= 20)
    broad: affected_rate >= 0.20 OR affected_count >= 100
  betroffenheit_conditions:
    broad:
      any:
      - metric: affected_rate
        operator: gte
        value: 0.2
      - metric: affected_count
        operator: gte
        value: 100
    material:
      any:
      - metric: affected_rate
        operator: gte
        value: 0.05
      - metric: affected_count
        operator: gte
        value: 20
    limited:
      any:
      - metric: affected_rate
        operator: gte
        value: 0.01
      - metric: affected_count
        operator: gte
        value: 5
    isolated:
      metric: affected_count
      operator: gt
      value: 0
    none:
      metric: affected_count
      operator: eq
      value: 0
  betroffenheit_precedence:
  - broad
  - material
  - limited
  - isolated
  - none
  betroffenheit_input_invariants:
  - analyzed_count must be a positive integer before a band is assigned; otherwise Betroffenheit is ND.
  - affected_count must be an integer from zero through analyzed_count.
  - 'affected_rate is calculated, never supplied: affected_count / analyzed_count.'
  sitewide_counting_rule: COUNT(DISTINCT normalized_page_url); never add parent and child path-prefix counts.
  cluster_mapping_reuse: Structural URL-prefix membership is always recalculated from the current crawl. Confirmed semantic
    labels and business criticality may be reused only while their normalized prefix pattern is unchanged; stale mappings
    cannot modify status or priority.
  gsc_url_inspection: Full inventory when eligible URL count <= 2000; deterministic priority sample capped at 2000 otherwise.
  lighthouse_basis: Lighthouse lab is the primary URL-level basis. CrUX is optional context; TBT is never renamed INP.
priority_policy:
  algorithm_version: priority-v1
  priority_order:
  - P0
  - P1
  - P2
  - P3
  priority_index:
    P0: 0
    P1: 1
    P2: 2
    P3: 3
  evaluation_order:
  - eligibility
  - status_base
  - betroffenheit
  - criticality
  - veto_floor
  - factor_ceiling
  - evidence_ceiling
  - scope_ceiling
  - confidence_ceiling
  - clamp
  - tie_break
  status_steps:
    red: 0
    yellow: 1
    green: null
    ND: null
    NA: null
  ceiling_resolution: Convert every applicable ceiling to its priority index and take max(current_index, ceiling_indices);
    a ceiling can only make priority less urgent.
  floor_resolution: For a proven red veto at high confidence, take min(current_index, floor_index) before ceilings; a floor
    can only make priority more urgent.
  meaning:
    P0: Confirmed critical eligibility block or severe accuracy/reputation risk on a critical or broad scope.
    P1: Material direct problem or strategic gap requiring planned remediation.
    P2: Meaningful limited-scope problem or supporting driver.
    P3: Low-materiality hygiene or opportunity item.
  algorithm:
  - Return null for green, ND, NA, informational_only, or a rule whose base_priority is null.
  - For red start at factor base_priority; for yellow start one step less urgent, capped at P3.
  - 'Apply Betroffenheit: broad upgrades one step, material makes no change, limited downgrades one step, isolated downgrades
    two steps.'
  - For non-URL direct outcomes, complete configured model/country scope is material; a subset is limited unless explicitly
    critical.
  - A confirmed critical cluster/model/country may upgrade one step only when the rule permits it; unconfirmed mappings never
    modify priority.
  - A high-confidence red block veto has a P1 urgency floor; a high-confidence red overall veto has a P0 urgency floor.
  - Apply the factor priority_ceiling, then evidence/scope/confidence ceilings; the least urgent ceiling wins.
  - Yellow can never exceed P1. Medium confidence can never exceed P1; low confidence can never exceed P2.
  - G3 source-limited evidence is capped P1 for direct outcomes and P2 for supporting drivers. G4 is capped P1; diagnostic
    samples are capped P2 and representative samples P1.
  - Effort and implementation reversibility do not raise priority. Effort is separate; a low-effort P1/P2 item may receive
    Quick Win.
  betroffenheit_steps:
    broad: -1
    material: 0
    limited: 1
    isolated: 2
    none: null
  criticality_uplift_steps:
    critical: -1
    high: -1
    medium: 0
    low: 0
    unconfirmed: 0
  criticality_conditions:
    critical: any affected unit
    high: material or broad Betroffenheit only
  criticality_application:
    requires_confirmed_mapping: true
    critical_allowed_betroffenheit:
    - isolated
    - limited
    - material
    - broad
    high_allowed_betroffenheit:
    - material
    - broad
    maximum_uplift_steps: 1
  veto_floors:
    overall_red_high: P0
    block_red_high: P1
  confidence_ceilings:
    high: factor_ceiling
    medium: P1
    low: P2
  evidence_ceilings:
    G1_DIRECT: factor_ceiling
    G2_CALCULATED: factor_ceiling
    G3_SOURCE_LIMITED_direct: P1
    G3_SOURCE_LIMITED_supporting: P2
    G4_SUPPORTED_INFERENCE: P1
  scope_ceilings:
    full: factor_ceiling
    snapshot: factor_ceiling
    representative_sample: P1
    diagnostic_sample: P2
    source_corpus_direct: P1
    source_corpus_supporting: P2
  harm_risk_rule: Only an evidence-backed eligibility/accuracy/reputation veto affects the urgency floor; speculative harm
    does not.
  implementation_risk_rule: Implementation risk changes validation and rollback requirements, not issue importance.
  effort_effect_on_priority: none
  tie_break_order:
  - priority
  - veto_role
  - dependency_role
  - betroffenheit_band
  - affected_count
  - factor_id
  summary_order: P0, P1, P2, P3, then overall veto before block veto, eligibility/direct before supporting, broad before isolated,
    larger affected_count, factor_id ascending.
